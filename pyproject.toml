[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tell"
version = "0.1.0"
description = "Tell: a local security runtime for an autonomous accounts-payable agent, combining an instrumented local model, an activation probe, a safety LoRA, and a deterministic action gate."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Pinned versions used for the prototype are in requirements.txt (installed by setup.sh).
dependencies = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "safetensors",
    "numpy",
    "scipy",
    "scikit-learn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
